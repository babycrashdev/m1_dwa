# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/rplacedb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:user}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server configuration
server.port=8080

# Logging configuration (Test Logger)
logging.level.root=INFO
logging.level.com.example.m1dwa=DEBUG
logging.file.name=logs/test-logger.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# JWT Configuration
app.jwtSecret=${APP_JWT_SECRET:6XibCXmINtznZPzVklzlOXm134KruJJPye9KrYFtEbi}
app.jwtExpirationMs=${APP_JWT_EXPIRATION:86400000}

# RPlace Configuration
rplace.grid.size=${RPLACE_GRID_SIZE:100}
rplace.pixel.initial-price=${RPLACE_INITIAL_PRICE:10}
rplace.pixel.price-increment=${RPLACE_PRICE_INCREMENT:5}
